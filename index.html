<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fethi Gifts | Luxury Floral</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --accent-gold: #d4af37;
            --deep-green: #1a2e21;
            --white: #ffffff;
            --black: #0a0a0a;
            --transition-hero: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        html, body {
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            background-color: var(--white);
        }

        /* --- شاشة افتتاحية --- */
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: transform 1.2s cubic-bezier(1, 0, 0, 1);
            will-change: transform;
        }
        #preloader.finish { transform: translateY(-100%); }
        .loader-text {
            font-family: 'Playfair Display', serif;
            color: var(--white);
            font-size: 1.8rem;
            letter-spacing: 10px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInText 1s forwards ease;
        }
        @keyframes fadeInText { to { opacity: 1; transform: translateY(0); } }

        body { font-family: 'Montserrat', sans-serif; opacity: 0; transition: opacity 0.5s ease; }
        body.loaded { opacity: 1; }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0; width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            z-index: 1000;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
            will-change: padding, background;
        }
        nav.scrolled {
            background: rgba(255, 255, 255, 0.98);
            padding: 12px 8%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-weight: 800;
            color: var(--white);
            text-decoration: none;
            transition: all 0.5s ease;
        }
        nav.scrolled .nav-logo { 
            color: var(--deep-green); 
            font-size: clamp(1rem, 2.5vw, 1.4rem);
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: clamp(15px, 3vw, 35px);
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--white);
            font-size: clamp(0.7rem, 2vw, 0.85rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }
        nav.scrolled .nav-links a { color: var(--deep-green); }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('photo_2026-04-29_18-48-39.jpg') center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--white);
            overflow: hidden;
        }
        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3.5rem, 12vw, 8rem);
            margin: 0;
            transform: translateY(100%);
            transition: var(--transition-hero);
            will-change: transform;
        }
        body.loaded .hero h1 { transform: translateY(0); opacity: 1; }

        /* --- Gallery --- */
        .gallery-container { padding: 120px 5% 60px; text-align: center; }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            margin-bottom: 80px;
            color: var(--deep-green);
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s ease;
            will-change: transform, opacity;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            justify-content: center;
            justify-items: center;
        }
        .gallery-card {
            width: 100%; max-width: 480px;
            height: clamp(450px, 75vh, 600px);
            overflow: hidden; opacity: 0;
            transform: translateY(50px);
            transition: all 1.2s cubic-bezier(0.165, 0.84, 0.44, 1);
            will-change: transform, opacity;
        }
        .gallery-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 2s ease; }
        .gallery-card:hover img { transform: scale(1.1); }

        /* --- Contact --- */
        .contact-section { padding: 120px 5%; background: #fff; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .contact-section h2 { font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 5vw, 3rem); margin-bottom: 50px; color: var(--deep-green); }
        .circles-wrapper { display: flex; justify-content: center; gap: 25px; flex-wrap: wrap; }
        .circle-btn { width: 70px; height: 70px; background: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.08); transition: 0.5s; text-decoration: none; }
        .circle-btn:hover { transform: translateY(-15px) scale(1.1); background: var(--deep-green); color: #fff !important; }

        footer { padding: 60px 5%; text-align: center; font-size: 0.8rem; letter-spacing: 3px; color: #bbb; text-transform: uppercase; }

        .reveal { opacity: 1 !important; transform: translateY(0) !important; }

        @media (max-width: 480px) {
            nav { padding: 15px 5%; }
            .nav-logo { font-size: 1.1rem; }
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="loader-text">FETHI GIFTS</div>
    </div>

    <nav id="mainNav">
        <a href="#" class="nav-logo">Fethi Gifts</a>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="hero" id="home">
        <h1>Fethi Gifts</h1>
    </section>

    <section class="gallery-container" id="gallery">
        <h2 class="section-title">Exclusive Collection</h2>
        <div class="gallery-grid">
            <div class="gallery-card"><img src="1.png" alt="Gallery Item 1"></div>
            <div class="gallery-card"><img src="2.png" alt="Gallery Item 2"></div>
            <div class="gallery-card"><img src="3.png" alt="Gallery Item 3"></div>
            <div class="gallery-card"><img src="4.png" alt="Gallery Item 4"></div>
            <div class="gallery-card"><img src="5.png" alt="Gallery Item 5"></div>
            <div class="gallery-card"><img src="6.png" alt="Gallery Item 6"></div>
        </div>
    </section>

    <section class="contact-section" id="contact">
        <h2>Get In Touch</h2>
        <div class="circles-wrapper">
            <a href="tel:0792995838" target="_blank" class="circle-btn" style="color: #2ecc71;" aria-label="Phone"><i class="fa-solid fa-phone"></i></a>
            <a href="https://www.instagram.com/fethi_gifts?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="circle-btn" style="color: #E1306C;" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@fethi_gifts" target="_blank" class="circle-btn" style="color: #000;" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://www.facebook.com/profile.php?id=61567811606192" target="_blank" class="circle-btn" style="color: #1877F2;" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        </div>
    </section>

    <footer>&copy; 2026 FETHI GIFT | EST. IN LUXURY</footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const preloader = document.getElementById('preloader');
            const mainNav = document.getElementById('mainNav');

            // التحكم في شاشة التحميل
            const dismissPreloader = () => {
                if (!preloader.classList.contains('finish')) {
                    preloader.classList.add('finish');
                    document.body.classList.add('loaded');
                }
            };

            // إخفاء التحميل عند اكتمال الصفحة أو بعد 2.5 ثانية كحد أقصى
            if (document.readyState === 'complete') {
                setTimeout(dismissPreloader, 800);
            } else {
                window.addEventListener('load', () => setTimeout(dismissPreloader, 800));
                setTimeout(dismissPreloader, 2500);
            }

            // مراقب الحركة للتمرير (Optimized Scroll Animation)
            const observerOptions = {
                root: null,
                threshold: 0.15,
                rootMargin: "0px 0px -50px 0px"
            };

            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal');
                        observer.unobserve(entry.target); // إيقاف المراقبة بعد الظهور لترشيد الاستهلاك
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.gallery-card, .section-title').forEach(el => revealObserver.observe(el));

            // تحسين أداء حدث الـ Scroll للـ Navbar
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        mainNav.classList.toggle('scrolled', window.scrollY > 80);
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });
        });
    </script>
</body>
</html>
