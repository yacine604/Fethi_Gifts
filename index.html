<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Fethi Gifts | Luxury Floral</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --accent-gold: #d4af37;
            --deep-green: #1a2e21;
            --white: #ffffff;
            --black: #0a0a0a;
            --transition-hero: all 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            background-color: var(--white);
            -webkit-text-size-adjust: 100%;
        }

        /* --- شاشة افتتاحية --- */
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: transform 1.2s cubic-bezier(1, 0, 0, 1);
            will-change: transform;
        }
        #preloader.finish { transform: translateY(-100%); }
        .loader-text {
            font-family: 'Playfair Display', serif;
            color: var(--white);
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            letter-spacing: clamp(4px, 2vw, 10px);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInText 1s forwards ease;
            text-align: center;
            padding: 0 10px;
        }
        @keyframes fadeInText { to { opacity: 1; transform: translateY(0); } }

        body { font-family: 'Montserrat', sans-serif; opacity: 0; transition: opacity 0.5s ease; }
        body.loaded { opacity: 1; }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0; 
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 6%;
            z-index: 1000;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: padding, background;
        }
        nav.scrolled {
            background: rgba(255, 255, 255, 0.98);
            padding: 12px 6%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Playfair Display', serif;
            font-size: clamp(1rem, 3.5vw, 1.6rem);
            font-weight: 800;
            color: var(--white);
            text-decoration: none;
            transition: all 0.5s ease;
        }

        .nav-logo-img {
            height: clamp(28px, 5vw, 40px);
            width: auto;
            object-fit: contain;
            transition: height 0.5s ease;
        }

        nav.scrolled .nav-logo { 
            color: var(--deep-green); 
            font-size: clamp(0.95rem, 3vw, 1.4rem);
        }

        nav.scrolled .nav-logo-img {
            height: clamp(24px, 4vw, 32px);
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: clamp(10px, 2.5vw, 35px);
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--white);
            font-size: clamp(0.65rem, 1.8vw, 0.85rem);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: clamp(0.5px, 0.3vw, 2px);
            transition: color 0.3s ease;
            white-space: nowrap;
        }
        nav.scrolled .nav-links a { color: var(--deep-green); }

        /* --- Seamless Integrated Hero & Long Image Section --- */
        .integrated-hero-container {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--black);
            margin: 0;
            padding: 0;
        }

        .hero-banner {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .hero-banner img.hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2;
        }

        .hero-banner h1 {
            position: relative;
            z-index: 3;
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 10vw, 8rem);
            color: var(--white);
            margin: 0;
            padding: 0 15px;
            transform: translateY(100%);
            transition: var(--transition-hero);
            will-change: transform;
            word-break: break-word;
        }
        body.loaded .hero-banner h1 { transform: translateY(0); opacity: 1; }

        .merged-long-pic {
            width: 100%;
            display: block;
            margin: 0;
            padding: 0;
            border: none;
            outline: none;
        }

        .merged-long-pic img {
            width: 100%;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            padding: 0;
            border: 0;
            vertical-align: bottom;
        }

        /* --- Gallery Slider --- */
        .gallery-container { 
            padding: clamp(60px, 10vw, 120px) 4% clamp(40px, 6vw, 60px); 
            text-align: center; 
        }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 5vw, 3.5rem);
            margin-bottom: clamp(30px, 6vw, 60px);
            color: var(--deep-green);
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s ease;
            will-change: transform, opacity;
        }
        
        .slider-wrapper {
            position: relative;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 12px;
            background-color: #2e7d32;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(50px);
            transition: opacity 1.2s cubic-bezier(0.165, 0.84, 0.44, 1), 
                        transform 1.2s cubic-bezier(0.165, 0.84, 0.44, 1),
                        background-color 0.8s ease;
        }

        .slider-track {
            position: relative;
            width: 100%;
            height: clamp(320px, 65vh, 800px);
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transform: scale(1.05);
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), 
                        transform 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                        visibility 0.8s;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            padding: 10px;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            z-index: 2;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            color: var(--deep-green);
            border: none;
            width: clamp(38px, 6vw, 55px);
            height: clamp(38px, 6vw, 55px);
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(0.9rem, 2.5vw, 1.3rem);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .slider-btn:hover {
            background: var(--deep-green);
            color: var(--white);
        }

        .slider-btn.prev { left: clamp(8px, 2vw, 25px); }
        .slider-btn.next { right: clamp(8px, 2vw, 25px); }

        .slider-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .dot {
            width: clamp(8px, 2vw, 12px);
            height: clamp(8px, 2vw, 12px);
            border-radius: 50%;
            background: #ccc;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: var(--deep-green);
            transform: scale(1.2);
        }

        /* --- Contact --- */
        .contact-section { 
            padding: clamp(60px, 10vw, 120px) 5%; 
            background: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-align: center; 
        }
        .contact-section h2 { 
            font-family: 'Playfair Display', serif; 
            font-size: clamp(1.8rem, 5vw, 3rem); 
            margin-bottom: clamp(30px, 5vw, 50px); 
            color: var(--deep-green); 
        }
        .circles-wrapper { 
            display: flex; 
            justify-content: center; 
            gap: clamp(12px, 3vw, 25px); 
            flex-wrap: wrap; 
            max-width: 600px;
        }
        .circle-btn { 
            width: clamp(50px, 12vw, 70px); 
            height: clamp(50px, 12vw, 70px); 
            background: #fff; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: clamp(1.1rem, 3.5vw, 1.5rem); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            transition: 0.5s; 
            text-decoration: none; 
        }
        .circle-btn:hover { 
            transform: translateY(-10px) scale(1.08); 
            background: var(--deep-green); 
            color: #fff !important; 
        }

        footer { 
            padding: clamp(30px, 5vw, 60px) 5%; 
            text-align: center; 
            font-size: clamp(0.65rem, 1.8vw, 0.8rem); 
            letter-spacing: clamp(1.5px, 0.5vw, 3px); 
            color: #bbb; 
            text-transform: uppercase; 
        }

        .reveal { opacity: 1 !important; transform: translateY(0) !important; }

        /* --- Custom Media Queries for Specific Devices --- */
        @media (max-width: 768px) {
            nav { padding: 15px 5%; }
            .nav-links { gap: 12px; }
            .circle-btn:hover { transform: none; } /* إلغاء التمرير المتكلف في اللمس */
        }

        @media (max-width: 480px) {
            nav { padding: 12px 4%; }
            .nav-logo span { font-size: 0.95rem; }
            .slider-track { height: 50vh; min-height: 280px; }
        }

        @media (max-width: 360px) {
            .nav-logo span { display: none; } /* تحسين المساحة للهواتف الضيقة للغاية */
            .nav-links { gap: 8px; }
            .nav-links a { font-size: 0.6rem; letter-spacing: 0.5px; }
        }
    </style>
</head>
<body>

    <div id="preloader">
        <div class="loader-text">FETHI GIFTS</div>
    </div>

    <nav id="mainNav">
        <a href="#" class="nav-logo">
            <img src="Logo.png" alt="Fethi Gifts Logo" class="nav-logo-img">
            <span>Fethi Gifts</span>
        </a>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <div class="integrated-hero-container" id="home">
        <div class="hero-banner">
            <img src="photo_2026-04-29_18-48-39.jpg" alt="Fethi Gifts Hero Background" class="hero-bg">
            <div class="hero-overlay"></div>
            <h1>Fethi Gifts</h1>
        </div>
        <div class="merged-long-pic">
            <img src="pic.png" alt="Integrated Presentation Section">
        </div>
    </div>

    <section class="gallery-container" id="gallery">
        <h2 class="section-title">Exclusive Collection</h2>
        <div class="slider-wrapper" id="sliderWrapper">
            <button class="slider-btn prev" aria-label="Previous Slide"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="slider-track">
                <div class="slide active" data-bg="#2e7d32"><img src="1.png" alt="Gallery Item 1"></div>
                <div class="slide" data-bg="#4a0e17"><img src="2.png" alt="Gallery Item 2"></div>
                <div class="slide" data-bg="#ffeb3b"><img src="3.png" alt="Gallery Item 3"></div>
                <div class="slide" data-bg="#4a0e17"><img src="4.png" alt="Gallery Item 4"></div>
                <div class="slide" data-bg="#8b0000"><img src="5.png" alt="Gallery Item 5"></div>
                <div class="slide" data-bg="#2d4a3e"><img src="6.png" alt="Gallery Item 6"></div>
            </div>
            <button class="slider-btn next" aria-label="Next Slide"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="slider-dots"></div>
    </section>

    <section class="contact-section" id="contact">
        <h2>Get In Touch</h2>
        <div class="circles-wrapper">
            <a href="tel:0792995838" target="_blank" class="circle-btn" style="color: #2ecc71;" aria-label="Phone"><i class="fa-solid fa-phone"></i></a>
            <a href="https://www.instagram.com/fethi_gifts?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="circle-btn" style="color: #E1306C;" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@fethi_gifts" target="_blank" class="circle-btn" style="color: #000;" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="https://www.facebook.com/profile.php?id=61567811606192" target="_blank" class="circle-btn" style="color: #1877F2;" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        </div>
    </section>

    <footer>&copy; 2026 FETHI GIFT | EST. IN LUXURY</footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const preloader = document.getElementById('preloader');
            const mainNav = document.getElementById('mainNav');

            const dismissPreloader = () => {
                if (!preloader.classList.contains('finish')) {
                    preloader.classList.add('finish');
                    document.body.classList.add('loaded');
                }
            };

            if (document.readyState === 'complete') {
                setTimeout(dismissPreloader, 800);
            } else {
                window.addEventListener('load', () => setTimeout(dismissPreloader, 800));
                setTimeout(dismissPreloader, 2500);
            }

            const observerOptions = {
                root: null,
                threshold: 0.1,
                rootMargin: "0px 0px -30px 0px"
            };

            const revealObserver = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.slider-wrapper, .section-title').forEach(el => revealObserver.observe(el));

            let ticking = false;
            window.addEventListener('scroll', () => {
                if (!ticking) {
                    window.requestAnimationFrame(() => {
                        mainNav.classList.toggle('scrolled', window.scrollY > 50);
                        ticking = false;
                    });
                    ticking = true;
                }
            }, { passive: true });

            // --- Dynamic Background Slider Logic ---
            const slides = Array.from(document.querySelectorAll('.slide'));
            const nextBtn = document.querySelector('.slider-btn.next');
            const prevBtn = document.querySelector('.slider-btn.prev');
            const dotsNav = document.querySelector('.slider-dots');
            const sliderWrapper = document.getElementById('sliderWrapper');
            
            let currentIndex = 0;
            let autoplayTimer = null;

            slides.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if (index === 0) dot.classList.add('active');
                dot.addEventListener('click', () => goToSlide(index));
                dotsNav.appendChild(dot);
            });

            const dots = Array.from(dotsNav.children);

            const updateSlider = () => {
                slides.forEach((slide, index) => {
                    slide.classList.toggle('active', index === currentIndex);
                });
                dots.forEach((dot, index) => {
                    dot.classList.toggle('active', index === currentIndex);
                });
                
                const currentBg = slides[currentIndex].getAttribute('data-bg');
                sliderWrapper.style.backgroundColor = currentBg;
            };

            const goToSlide = (index) => {
                currentIndex = index;
                updateSlider();
                resetAutoplay();
            };

            const nextSlide = () => {
                currentIndex = (currentIndex + 1) % slides.length;
                updateSlider();
            };

            const prevSlide = () => {
                currentIndex = (currentIndex - 1 + slides.length) % slides.length;
                updateSlider();
            };

            nextBtn.addEventListener('click', () => { nextSlide(); resetAutoplay(); });
            prevBtn.addEventListener('click', () => { prevSlide(); resetAutoplay(); });

            const startAutoplay = () => {
                autoplayTimer = setInterval(nextSlide, 5000);
            };

            const resetAutoplay = () => {
                clearInterval(autoplayTimer);
                startAutoplay();
            };

            sliderWrapper.addEventListener('mouseenter', () => clearInterval(autoplayTimer));
            sliderWrapper.addEventListener('mouseleave', startAutoplay);

            let startX = 0;
            let isDragging = false;

            sliderWrapper.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                isDragging = true;
                clearInterval(autoplayTimer);
            }, { passive: true });

            sliderWrapper.addEventListener('touchend', (e) => {
                if (!isDragging) return;
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;

                if (Math.abs(diffX) > 30) {
                    if (diffX > 0) nextSlide();
                    else prevSlide();
                }
                isDragging = false;
                startAutoplay();
            }, { passive: true });

            updateSlider();
            startAutoplay();
        });
    </script>
</body>
</html>
